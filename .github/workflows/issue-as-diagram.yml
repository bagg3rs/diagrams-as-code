name: Issue as Diagram

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch-and-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Create new branch
        id: create-branch
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const issueTitle = context.payload.issue.title;
            const branchName = issueTitle
              .toLowerCase()
              .replace(/[^a-z0-9._-]+/g, '-')
              .replace(/^-+|-+$/g, '') || `issue-${context.issue.number}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branchName}`,
              sha: context.sha
            });
            return branchName;

      - name: Comment on issue
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.create-branch.outputs.result }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const url = `https://github.dev/${context.repo.owner}/${context.repo.repo}/tree/${branchName}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `A new branch has been created: [${branchName}](${url})`
            });
