name: Create Animated GIF

# Builds diagrams/animated.gif from the PNG diagrams under diagrams/.
# - Pull requests touching diagrams or this workflow: build only (no commit).
# - Pushes to main touching diagrams: build and commit the GIF.
# Previously this ran on every push to every branch and globbed *.png at the
# repo root, where no PNGs have ever existed, so it failed on every run.
on:
  push:
    branches: [main]
    paths:
      - "diagrams/**/*.png"
      - ".github/workflows/generate-gif.yml"
  pull_request:
    paths:
      - "diagrams/**/*.png"
      - ".github/workflows/generate-gif.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ImageMagick
        run: |
          if ! command -v convert >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Create GIF from images
        run: |
          shopt -s globstar nullglob
          images=(diagrams/**/*.png)
          if [ ${#images[@]} -eq 0 ]; then
            echo "No PNG diagrams found under diagrams/; nothing to do."
            exit 0
          fi
          echo "Building GIF from ${#images[@]} image(s):"
          printf '  %s\n' "${images[@]}"
          convert -delay 100 -loop 0 -background white -alpha remove "${images[@]}" diagrams/animated.gif
          ls -l diagrams/animated.gif

      - name: Commit and push GIF
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          [ -f diagrams/animated.gif ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagrams/animated.gif
          if git diff --cached --quiet; then
            echo "GIF unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Update animated GIF"
          git push
